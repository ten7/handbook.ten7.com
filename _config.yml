# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: "Employee Handbook"
url: "https://handbook.ten7.com"
description: "TEN7's employee handbook: who we are, our culture, benefits, how we work, travel, performance, and how to quit."
subtitle: "Version 5.3.0, 10/01/26"

nav:
  - title: "Start Here"
    subfolderitems:
      show_numbers: true
      items:
        - title: "Welcome"
          description: "We're so glad you're here."
          url: "/welcome.html"
        - title: "Who We Are"
          description: "Our company and contact info"
          url: "/whoweare.html"
        - title: "Our Culture"
          description: "Our mission and values"
          url: "/ourculture.html"
        - title: "Our Benefits"
          description: "Insurance, 401k and more"
          url: "/ourbenefits.html"
        - title: "How We Do Things"
          description: "Working remotely, Slack, Harvest"
          url: "/howwedothings.html"
        - title: "Travel"
          description: "Our travel and expense policy"
          url: "/travel.html"
        - title: "Performance"
          description: "Regular check ins"
          url: "/performance.html"
        - title: "How To Quit"
          description: "We only just started!"
          url: "/howtoquit.html"
        - title: "Legalese"
          description: "Legal details"
          url: "/legalese.html"

# Entities used by the JSON-LD graph (_includes/schema.html).
organization:
  id: "https://ten7.com"
  name: "TEN7"
  legal_name: "Ten 7 Interactive, LLC"
  url: "https://ten7.com"
  description: "TEN7 is a digital agency that builds, rescues and cares for Drupal sites and their teams."
  founding_date: "2007"
  telephone: "+1-612-868-7884"
  email: "hi@ten7.com"
  street_address: "1904 James Ave S"
  address_locality: "Minneapolis"
  address_region: "MN"
  postal_code: "55403"
  address_country: "US"
  area_served: "US"
  same_as:
    - "https://www.linkedin.com/company/TEN7"
    - "https://github.com/TEN7"
person:
  id: "https://handbook.ten7.com/whoweare.html#ivan-stegic"
  name: "Ivan Stegic"
  job_title: "CEO"

# Build settings
# theme: TBD
plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown

collections:
  pages:
    output: true
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - assets/_src/
  - docs/
  - Gemfile
  - Gemfile.lock
  - imagemin.js
  - LICENSE
  - node_modules/
  - npm-debug.log
  - package.json
  - package-lock.json
  - README.md
  - tsconfig.json
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - webpack.config.js
  - yarn.lock
